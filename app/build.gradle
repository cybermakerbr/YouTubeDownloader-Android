plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.f3an0r.youtubedownloader'
    compileSdk 36

    defaultConfig {
        applicationId 'br.com.f3an0r.youtubedownloader'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    // O Moto G53 é ARM64. Mantemos apenas esta ABI para reduzir o APK.
    ndkVersion '27.2.12479018'

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a'
            universalApk false
        }
    }
}

dependencies {
    // yt-dlp + Python embutidos.
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'

    // FFmpeg embutido para merge de vídeo/áudio e extração MP3.
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.10.1'
}
